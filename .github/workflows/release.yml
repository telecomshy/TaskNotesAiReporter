name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Build plugin
              run: |
                  npm ci
                  npm run build

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  # Published directly (no --draft): the assets uploaded here are the
                  # exact bytes the attestation above signs. Uploading assets by hand
                  # from a Windows checkout (CRLF) breaks digest verification.
                  assets=(main.js manifest.json)
                  if [ "${{ steps.styles.outputs.exists }}" = "true" ]; then
                      assets+=(styles.css)
                  fi

                  # Release notes: the directory flags a release with no description.
                  # Prefer the annotated tag message (git tag -a 1.2.3 -m "notes"),
                  # ignoring a message that only repeats the tag name; otherwise let
                  # GitHub generate the change list. Hand-written notes can also be
                  # edited on the release page after publishing.
                  notes="$(git tag -l --format='%(contents)' "$tag" 2>/dev/null || true)"
                  if [ -n "${notes// }" ] && [ "$notes" != "$tag" ]; then
                      gh release create "$tag" --title="$tag" --notes "$notes" "${assets[@]}"
                  else
                      gh release create "$tag" --title="$tag" --generate-notes "${assets[@]}"
                  fi
